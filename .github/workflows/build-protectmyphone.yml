name: Build protectmyphone APK

on:
  push:
    branches:
      - build/login-inventory-android
    paths:
      - "android/protectmyphone/**"
      - ".github/workflows/build-protectmyphone.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android/protectmyphone --no-daemon assembleDebug

      - name: Rename APK
        run: cp android/protectmyphone/app/build/outputs/apk/debug/app-debug.apk protectmyphone.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: protectmyphone-apk
          path: protectmyphone.apk
          if-no-files-found: error
